name: Nightly Unit Tests

# The same tests the PR gate runs (both call unit-tests.yml), run daily against master. Every
# commit on master already passed them in the gate, so a red nightly points at something outside
# our code: a runner image update, a new .NET patch release, or a flaky test.
#
# Note: GitHub only runs `schedule` on the default branch, and it disables scheduled workflows
# after 60 days with no repository activity.
on:
  schedule:
    # 06:00 UTC daily.
    - cron: '0 6 * * *'
  workflow_dispatch:

# A caller must grant at least what the workflow it calls declares.
permissions:
  contents: read

jobs:
  nightly:
    name: Nightly
    uses: ./.github/workflows/unit-tests.yml
