name: Build & Run Unit Tests

on:
  push:
    branches:
      - master
      # Release branches ("3.10") and patch branches ("3.9.5"). These take direct pushes -
      # chiefly a merge from master to bring the branch up to date - which no pull_request
      # event covers, so without these they would land untested.
      #
      # Deliberately narrow rather than '*', which a6802f287 removed because a branch with an
      # open PR then runs everything twice, once for push and once for pull_request. Release
      # branches are only ever PR targets, never PR heads, so they cannot double-run.
      #
      # These are GitHub filter patterns, not regexes: '+' means one or more of the preceding
      # character, and '.' is a literal dot. Both patterns are needed because a pattern must
      # match the whole ref, so the two-part one does not match "3.9.5".
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite runs in ~5 minutes; without a cap, a hung test host sits on the 6h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: false

      - name: Restore
        run: dotnet restore couchbase-net-client.sln

      - name: Build (Release)
        run: dotnet build couchbase-net-client.sln --configuration Release

      # --blame-hang turns an intermittent hung test host into a fast red plus a dump, instead of a job
      # that sits until the timeout with no diagnostics. The suite finishes in well under a minute per
      # TFM, so 5min of no test activity means it is stuck.
      - name: Test - Couchbase.UnitTests
        run: dotnet test tests/Couchbase.UnitTests/Couchbase.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory "TestResults" --blame-hang --blame-hang-timeout 5min --blame-hang-dump-type full

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}
          path: TestResults

