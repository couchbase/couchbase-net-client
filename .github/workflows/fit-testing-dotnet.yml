name: Run FIT-CLI

# Thin caller for the shared FIT workflow. Anything non-trivial belongs in fit-cli itself, or
# failing that in couchbaselabs/fit-cli/.github/workflows/fit-cli.yaml — not here. There are 30+
# of these callers across the SDKs, so logic duplicated here has to be maintained 30+ times.
#
# The shared workflow expands preset groups into one job per preset (each with its own 6h GitHub
# budget), runs them with fail-fast disabled, and names each job after its preset.

on:
  schedule:
    # Staggered against the other SDKs' FIT nightlies: the fit-cli install step curls
    # raw.githubusercontent.com, which allows only 60 unauthenticated requests/hour.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      preset:
        description: FIT presets or preset groups to run, comma-separated. (`fit preset list`)
        required: false
        type: string
        default: op-multi-lite
      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        required: false
        type: boolean
        default: true
      channel:
        description: fit-cli install channel ("latest" or "ci").
        required: false
        type: string
        default: ci

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read
  checks: write

jobs:
  fit:
    uses: couchbaselabs/fit-cli/.github/workflows/fit-cli.yaml@main
    with:
      preset: ${{ vars.FIT_CLI_PRESET || inputs.preset || 'op-multi-lite' }}
      collect_extra_diagnostics: ${{ inputs.collect_extra_diagnostics == '' && true || inputs.collect_extra_diagnostics }}
      performer: 'dotnet-fit-performer:main'
      channel: ${{ vars.FIT_CLI_CHANNEL || inputs.channel || 'ci' }}
