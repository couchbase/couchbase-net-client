name: Run FIT-CLI

# Thin caller for the shared FIT workflow. Anything non-trivial belongs in fit-cli itself, or
# failing that in couchbaselabs/fit-cli/.github/workflows/fit-cli.yaml — not here. There are 30+
# of these callers across the SDKs, so logic duplicated here has to be maintained 30+ times.
#
# The shared workflow expands preset groups into one job per preset (each with its own 6h GitHub
# budget), runs them with fail-fast disabled, and names each job after its preset.

on:
  schedule:
    # Staggered against the other SDKs' FIT nightlies: the fit-cli install step curls
    # raw.githubusercontent.com, which allows only 60 unauthenticated requests/hour.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      preset:
        description: FIT presets or preset groups to run, comma-separated. (`fit preset list`)
        required: false
        type: string
        default: op-multi-lite
      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        required: false
        type: boolean
        default: true
      channel:
        description: fit-cli install channel ("latest" or "ci").
        required: false
        type: string
        default: latest
      performer_tag:
        description: >-
          Tag of the ghcr.io/couchbase/dotnet-fit-performer image to test. Defaults to the branch
          this workflow is run from. The SDK under test lives inside that image, so build it first
          via "Publish FIT Performer Image" with ref=<your-branch> — otherwise the run fails to
          pull the image. Use "main" to test master's SDK from a branch.
        required: false
        type: string
      env_override:
        description: >-
          Overrides applied to fit-cli's environments.json5, as comma-separated <path>=<value>
          pairs. Chiefly useful for testing a feature against a server the presets do not default
          to, e.g. "defaults.clusterVersion=8.1.0-2710". Only meaningful for presets that deploy
          the cluster themselves (the on-prem ones) — Capella presets take their version from
          Capella, and ignore it.
        required: false
        type: string

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read
  checks: write

jobs:
  # The SDK under test is baked into the performer image, not taken from the branch this workflow
  # runs on, so the image tag has to track the branch for a branch run to test that branch's code.
  # A `uses:` job cannot also have `steps`, hence the separate job to derive the tag.
  performer-tag:
    runs-on: ubuntu-latest
    permissions: {}   # no OIDC token needed here, unlike the fit job
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          # Via env, not inlined into the script: ${{ }} is substituted before bash parses it.
          PERFORMER_TAG: ${{ inputs.performer_tag }}
        run: |
          TAG="$PERFORMER_TAG"
          if [[ -z "$TAG" ]]; then
            # No input (a branch run with the default, or the nightly, which passes no inputs at
            # all) — derive the tag the same way the publish side does. See
            # couchbaselabs/sdk-docker-build-action, which renames master to main, and
            # docker/metadata-action, which collapses runs of [^a-zA-Z0-9._-] to '-' (so a branch
            # like dk/ncbc-4300 is published as dk-ncbc-4300).
            TAG="$GITHUB_REF_NAME"
            [[ "$TAG" == "master" ]] && TAG=main
            TAG=$(printf '%s' "$TAG" | sed -E 's/[^a-zA-Z0-9._-]+/-/g')
          fi
          echo "Testing performer image dotnet-fit-performer:$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  fit:
    needs: performer-tag
    uses: couchbaselabs/fit-cli/.github/workflows/fit-cli.yaml@main
    with:
      preset: ${{ vars.FIT_CLI_PRESET || inputs.preset || 'op-multi-lite' }}
      collect_extra_diagnostics: ${{ inputs.collect_extra_diagnostics == '' && true || inputs.collect_extra_diagnostics }}
      performer: dotnet-fit-performer:${{ needs.performer-tag.outputs.tag }}
      # 'latest', not 'ci': the ci channel went stale at a 2026-08-10 build and stopped
      # picking up fixes, which killed Capella cluster allocation from 2026-08-21 - see
      # NCBC-4288. Note the input default above does NOT apply to the
      # nightly: scheduled runs supply no inputs and workflow_dispatch defaults only apply to
      # dispatches, so this literal is what the nightly actually uses.
      channel: ${{ vars.FIT_CLI_CHANNEL || inputs.channel || 'latest' }}
      # Empty on the nightly, which passes no inputs — so the nightly keeps the presets' own
      # default server version.
      env_override: ${{ inputs.env_override }}
